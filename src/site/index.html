<!DOCTYPE html>
<html lang="en" class="min-h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quick Issues — Curated, Solvable Open Source Issues</title>
  <meta name="description" content="Curated open-source issues with low blast radius, zero setup friction, and fast maintainer reviews." />
  
  <link rel="alternate" type="application/rss+xml" title="Quick Issues RSS Feed" href="data/feed.xml" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'media',
    };
  </script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="min-h-screen flex flex-col bg-white dark:bg-zinc-950 text-zinc-900 dark:text-zinc-100 antialiased">

  <!-- Top Navigation Toolbar -->
  <header class="border-b border-zinc-200 dark:border-zinc-800 bg-white/90 dark:bg-zinc-950/90 backdrop-blur sticky top-0 z-20">
    <div class="max-w-3xl mx-auto px-4 sm:px-6 h-14 flex items-center justify-between gap-4">
      <!-- Brand -->
      <div class="flex items-center gap-3">
        <h1 class="text-base font-bold tracking-tight">
          <a href="./" class="hover:opacity-80 transition-opacity flex items-center gap-2">
            <span>⚡ Quick Issues</span>
          </a>
        </h1>
        <span id="stat-count-badge" class="text-[11px] font-mono px-2 py-0.5 rounded bg-zinc-100 dark:bg-zinc-900 text-zinc-600 dark:text-zinc-400">
          --
        </span>
      </div>

      <!-- Links -->
      <nav class="flex items-center gap-4 text-xs font-medium text-zinc-600 dark:text-zinc-400">
        <a href="about.html" class="hover:text-zinc-900 dark:hover:text-zinc-100 transition-colors">
          About &amp; FAQ
        </a>
        <a href="data/feed.xml" class="hover:text-zinc-900 dark:hover:text-zinc-100 transition-colors flex items-center gap-1" title="RSS Feed">
          <i data-lucide="rss" class="w-3.5 h-3.5"></i> RSS
        </a>
        <a href="https://github.com/jakeweidokal/oss-issues" target="_blank" rel="noopener noreferrer" class="hover:text-zinc-900 dark:hover:text-zinc-100 transition-colors flex items-center gap-1" title="GitHub Repository">
          <svg class="w-3.5 h-3.5 fill-current" viewBox="0 0 24 24"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>
          <span>GitHub</span>
        </a>
      </nav>
    </div>
  </header>

  <!-- Explainer Banner -->
  <div class="border-b border-zinc-200 dark:border-zinc-800/80 bg-zinc-50/80 dark:bg-zinc-900/40 py-2 px-4 sm:px-6">
    <div class="max-w-3xl mx-auto flex flex-wrap items-center justify-between gap-2 text-xs text-zinc-600 dark:text-zinc-400">
      <div class="flex items-center gap-2">
        <i data-lucide="info" class="w-3.5 h-3.5 text-zinc-400 shrink-0"></i>
        <span>Verified open-source tickets with small code blast radius, active maintainers, and reproduction commands.</span>
      </div>
      <a href="about.html" class="text-zinc-900 dark:text-zinc-100 font-semibold hover:underline flex items-center gap-1 shrink-0">
        <span>How it works</span>
        <i data-lucide="arrow-right" class="w-3 h-3"></i>
      </a>
    </div>
  </div>

  <!-- Main Stream Feed -->
  <main class="flex-1 max-w-3xl mx-auto w-full px-4 sm:px-6 py-8 space-y-6">

    <!-- HERO: First-Class Language Filter Pills -->
    <div class="space-y-2">
      <div class="flex items-center justify-between text-xs text-zinc-500 font-medium">
        <span>Filter by Language</span>
        <span id="list-count-label">Loading...</span>
      </div>
      <div id="language-tabs" class="flex items-center gap-2 overflow-x-auto pb-1 select-none">
        <button class="lang-pill active" data-lang="all">All Languages</button>
      </div>
    </div>

    <!-- Search & Secondary Filters -->
    <div class="grid grid-cols-1 sm:grid-cols-12 gap-2.5 pt-2">
      <!-- Search Input -->
      <div class="sm:col-span-6 relative">
        <i data-lucide="search" class="w-3.5 h-3.5 text-zinc-400 absolute left-3 top-1/2 -translate-y-1/2 pointer-events-none"></i>
        <input
          id="search-input"
          type="text"
          placeholder="Filter by title, repo, or keyword (Press /)..."
          class="w-full bg-zinc-100 dark:bg-zinc-900 border border-transparent focus:border-zinc-300 dark:focus:border-zinc-700 rounded-lg pl-8 pr-3 py-2 text-xs text-zinc-900 dark:text-zinc-100 placeholder-zinc-400 focus:outline-none transition-colors"
        />
      </div>

      <!-- Blast Radius Filter -->
      <div class="sm:col-span-3">
        <select id="blast-radius-filter" class="w-full bg-zinc-100 dark:bg-zinc-900 border border-transparent focus:border-zinc-300 dark:focus:border-zinc-700 rounded-lg px-2.5 py-2 text-xs text-zinc-700 dark:text-zinc-300 focus:outline-none">
          <option value="all">All Blast Radii</option>
          <option value="Low">Low Blast (Isolated)</option>
          <option value="Medium">Medium Blast</option>
          <option value="High">High Blast</option>
        </select>
      </div>

      <!-- Sort Filter -->
      <div class="sm:col-span-3">
        <select id="sort-by" class="w-full bg-zinc-100 dark:bg-zinc-900 border border-transparent focus:border-zinc-300 dark:focus:border-zinc-700 rounded-lg px-2.5 py-2 text-xs text-zinc-700 dark:text-zinc-300 focus:outline-none">
          <option value="solvability">Highest Solvability</option>
          <option value="recent">Most Recent</option>
          <option value="stars">Most Stars</option>
          <option value="turnaround">Fastest Review</option>
        </select>
      </div>
    </div>

    <!-- Issue Cards Container -->
    <section id="issues-container" class="space-y-5 pt-2">
      <div class="p-12 text-center text-xs text-zinc-400">Loading issues...</div>
    </section>

  </main>

  <!-- Footer -->
  <footer class="border-t border-zinc-200 dark:border-zinc-800 py-10 text-xs text-zinc-500 text-center mt-12">
    <div class="max-w-3xl mx-auto px-4 sm:px-6 flex flex-col sm:flex-row items-center justify-between gap-4">
      <div>Quick Issues &middot; Automated Open-Source Issue Directory</div>
      <div class="flex items-center gap-3">
        <a href="about.html" class="hover:underline">About &amp; FAQ</a>
        <span>&middot;</span>
        <a href="data/feed.xml" class="hover:underline">RSS Feed</a>
        <span>&middot;</span>
        <a href="https://github.com/jakeweidokal/oss-issues" target="_blank" rel="noopener noreferrer" class="hover:underline">GitHub</a>
      </div>
    </div>
  </footer>

  <!-- Toast -->
  <div id="toast" class="hidden fixed bottom-6 right-6 z-50 px-4 py-2 text-xs font-medium minimal-toast">
  </div>

  <script src="app.js"></script>
</body>
</html>
